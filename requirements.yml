---
# k3s 공식 Ansible collection.
#   설치: uv run ansible-galaxy collection install -r requirements.yml
#
# 이 collection 이 k3s 설치·HA 구성·업그레이드·제거를 모두 담당한다.
# 제공 플레이북: k3s.orchestration.site / upgrade / reset / reboot
collections:
  - name: https://github.com/k3s-io/k3s-ansible.git
    type: git
    version: "1.2.1"     # 버전 고정. 올릴 때는 변경 내역을 확인하고 바꾼다.
