[project]
# Ansible 은 파이썬 패키지다. uv 로 이 프로젝트 전용 격리환경에 설치한다.
# 시스템 전역(apt/pip)에 깔지 않으므로 다른 작업과 버전이 섞이지 않는다.
#
#   uv sync                     # .venv 생성 + 의존성 설치
#   uv run ansible --version
#
name = "onprem-k3s-deploy"
version = "0.1.0"
description = "Ansible 로 K3s 클러스터 구축을 자동화"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # ansible = ansible-core + 공식 collection 묶음.
    # ansible-core 만 깔면 모듈이 부족해 ansible-galaxy 로 따로 받아야 한다.
    "ansible>=14,<15",
]
