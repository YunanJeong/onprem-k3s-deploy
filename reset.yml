---
# ══════════════════════════════════════════════════════════════════════
# 클러스터 제거 — 실습/재구성용
#
#   실행:  ansible-playbook reset.yml
#
# Ansible 에는 terraform destroy 가 없다. 되돌리려면 이렇게 직접 쓴다.
# 다행히 k3s 는 설치 스크립트가 uninstall 스크립트를 함께 깔아준다.
#
# 주의: 클러스터와 그 안의 모든 데이터가 지워진다.
#       실수 방지를 위해 확인 프롬프트를 넣어뒀다.
# ══════════════════════════════════════════════════════════════════════

- name: "확인"
  hosts: localhost
  gather_facts: false
  become: false
  vars_prompt:
    - name: confirm
      prompt: |

        ⚠  k3s 클러스터를 완전히 삭제한다. 데이터도 함께 지워진다.
           대상: {{ groups['k3s'] | default([]) | join(', ') }}

           계속하려면 'yes' 를 입력해라
      private: false
  tasks:
    - name: 입력 확인
      ansible.builtin.assert:
        that: confirm | lower == 'yes'
        fail_msg: "취소했다."

- name: "k3s 제거"
  hosts: k3s
  become: true
  gather_facts: false
  tasks:
    # agent 를 먼저 떼어낸 뒤 server 를 지운다
    - name: k3s-agent 제거
      ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
      args:
        removes: /usr/local/bin/k3s-agent-uninstall.sh   # 없으면 skip
      when: inventory_hostname in groups['k3s_agent'] | default([])

    - name: k3s server 제거
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      args:
        removes: /usr/local/bin/k3s-uninstall.sh
      when: inventory_hostname in groups['k3s_server'] | default([])

    - name: 잔여 파일 정리
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher
        - /var/lib/rancher
        - /etc/profile.d/k3s.sh
        - /usr/local/bin/k9s
        - /usr/local/bin/helm

- name: "로컬 kubeconfig 삭제"
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: kubeconfig 제거
      ansible.builtin.file:
        path: ./kubeconfig
        state: absent
