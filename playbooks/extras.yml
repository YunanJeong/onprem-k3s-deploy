---
# ══════════════════════════════════════════════════════════════════════
# k3s 구축 후 부가 설정 — k3s 와 다른 계층
#
#   uv run ansible-playbook playbooks/prepare.yml   -i inventories/ha/hosts.yml
#   uv run ansible-playbook k3s.orchestration.site  -i inventories/ha/hosts.yml
#   uv run ansible-playbook playbooks/extras.yml    -i inventories/ha/hosts.yml   ← 이것
#
# k3s 자체를 까는 것은 공식 collection(k3s.orchestration) 안에 이미 있다.
# collection 플레이북과 인벤토리만 공유하고 실행은 완전히 독립이다.
# 순서 강제나 실패 전파가 없으므로 k3s 구축 후에 돌린다.
#
# 설치 도구는 최신 버전을 받는다. 특정 버전이 필요해지면 그때 URL 을 고정한다.
#
# play 별로 대상이 다르다. 일부만 돌리려면 --tags 를 쓴다
# (helm, k9s, vimrc, cert_rotate).
# ══════════════════════════════════════════════════════════════════════

- name: CLI 도구 설치 (server 노드)
  hosts: server
  become: true
  tasks:
    # 설치 스크립트 방식.
    # pipefail 없으면 curl 이 실패해도 bash 가 빈 입력을 받고 0 을 반환한다.
    # → task 는 성공으로 뜨는데 실제로는 아무것도 안 깔린다.
    - name: helm 설치
      # get-helm-4 는 helm 4.x 최신을, get-helm-3 은 3.x 최신을 받는다.
      # 두 계열이 병행 릴리스되므로 스크립트 이름이 곧 메이저 버전 선택이다.
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash
      args:
        creates: /usr/local/bin/helm   # 이 파일 있으면 skip → 재실행 안전
        executable: /bin/bash          # pipefail 은 bash 기능 (dash 에는 없다)
      tags: [helm]

    # GitHub 릴리스 tarball 방식. unarchive 가 URL 을 직접 받는다.
    # latest/download 는 최신 릴리스로 302 리다이렉트된다.
    # 버전을 고정하려면 latest/download 를 download/v0.51.0 처럼 바꾼다.
    - name: k9s 설치
      ansible.builtin.unarchive:
        src: "https://github.com/derailed/k9s/releases/latest/download/k9s_Linux_amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - k9s
        mode: "0755"
        creates: /usr/local/bin/k9s
      tags: [k9s]


# ── 셸 환경 (전 노드) ─────────────────────────────────────────────────
# 어느 노드에 들어가서든 파일을 편집하므로 server/agent 모두에 적용한다.
- name: 셸 환경 설정 (전 노드)
  hosts: k3s_cluster
  become: true
  tags: [vimrc]
  tasks:
    # vi 와 sudo vi 는 서로 다른 실행 파일이라 설정도 각각 필요하다.
    # 접속 계정 홈과 /root 양쪽에 넣는다.
    - name: vimrc 배포
      ansible.builtin.copy:
        src: files/vimrc
        dest: "{{ item }}/.vimrc"
        mode: "0644"
      loop:
        - "~{{ ansible_user }}"
        - /root

    # vimrc 의 colorscheme 이 TERM 값에 따라 다르게 보인다.
    # 어느 터미널에서 접속해도 같은 색을 보려면 TERM 을 고정한다.
    - name: TERM 고정 (색상 일관성)
      ansible.builtin.lineinfile:
        path: "{{ item }}/.bashrc"
        line: "TERM=xterm-256color"
        regexp: '^TERM='
        create: true
        mode: "0644"
      loop:
        - "~{{ ansible_user }}"
        - /root


# ── 인증서 자동 갱신 (전 노드) ────────────────────────────────────────
# k3s leaf 인증서는 1년 만료다. collection 에 이 기능이 없어 크론을 등록한다.
# 스크립트가 server/agent 를 스스로 판별한다.
- name: 인증서 갱신 크론 등록 (전 노드)
  hosts: k3s_cluster
  become: true
  tags: [cert_rotate]
  tasks:
    # 스크립트가 크론탭에 무조건 append 하므로, 이미 있으면 건너뛴다.
    - name: 크론 등록 여부 확인
      ansible.builtin.command: crontab -l
      register: crontab_cur
      changed_when: false
      failed_when: false      # 크론탭이 비어 있으면 rc != 0

    - name: install_cron_k3s_cert_rotate.sh 실행
      ansible.builtin.script: files/install_cron_k3s_cert_rotate.sh
      when: "'K3s 인증서 만료 방지' not in (crontab_cur.stdout | default(''))"
