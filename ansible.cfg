# Ansible 도구 자체 설정. playbook이 읽는 변수가 아니라
# ansible-playbook 실행기가 읽는 파일이다 (= 매번 치기 귀찮은 CLI 옵션의 기본값).
# 이 이름(ansible.cfg)만 자동으로 읽힌다. 다른 이름은 무시된다.

[defaults]
# -i inventory.ini 를 매번 안 치기 위함
inventory = ./inventory.ini

# 리모트 임시파일 경로. 기본값(~/.ansible/tmp) 대신 전용 경로를 써서
# 같은 서버를 쓰는 다른 담당자(시스템엔지니어 등)의 흔적과 섞이지 않게 한다.
# 접속 계정의 홈 밑이라 계정별로 자동 분리된다 (/tmp 공용 경로를 쓰면
# 다른 계정이 만든 디렉터리와 소유권이 충돌할 수 있다).
remote_tmp = ~/.ansible-onprem-k3s/tmp

# 실행할 때마다 SSH 비번을 물어본다 (= -k 플래그의 기본값 ON)
ask_pass = True

# skip 된 task 는 출력에서 감춘다 (실패/변경만 눈에 띄게)
display_skipped_hosts = False

# facts 수집 최소화 → 실행 속도 개선 (os_family, ansible_user_id 등은 그대로 수집됨)
gathering = smart
fact_caching = memory

[privilege_escalation]
# 실행할 때마다 sudo 비번을 물어본다 (= -K 플래그의 기본값 ON).
# sudo 비번이 SSH 비번과 같으면 프롬프트에서 엔터만 치면 된다.
# 주의: 이 키는 [defaults] 가 아니라 [privilege_escalation] 섹션이다.
#       엉뚱한 섹션에 두면 에러 없이 조용히 무시된다.
become_ask_pass = True

[ssh_connection]
# 임시파일 없이 SSH stdin으로 모듈을 밀어넣는다. 속도 개선.
# 요즘 배포판 sudo는 requiretty가 기본 off라 대체로 그냥 켜진다.
# 만약 sudo 관련 에러가 나면 이 줄을 False로 바꿔라.
pipelining = True

# SSH 연결 재사용 (task마다 재접속 안 하도록)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
